        return (
            <div>

            </p>
            </div>
        )
        }

        const App = (props) => {
        console.log(props);
        const name = 'Peter'
        const age = 10

        return (
            <div>
            <h1>Greetings</h1>
            <Hello name='Maya' age={26 + 10} />
            <Hello name={name} age={age} />
            <Hello name={props.names[0]} age={age} />
            </div>
        )
        }

    ReactDOM.render(<App names={variab} />, document.querySelector("#app"));
