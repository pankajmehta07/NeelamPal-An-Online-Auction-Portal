{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    {% block headjs %}{% endblock headjs %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock title %}</title>
    {% block css %}{% endblock css %}
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" 
    crossorigin="anonymous"
    />
    <!-- <link rel="stylesheet" type="text/css" href="{% static 'Auction/style.css' %}"> -->
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href="#">Home</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link{% block homeactive %}{% endblock homeactive %}" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% block categoryactive %}{% endblock categoryactive %}" href="#">Category</a>
          </li>
        </ul>
      </div>
      <form class="d-flex" method="GET" , action="#">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" id="search" name="search/"/>
        <button class="btn btn-outline-success mx-2" type="submit">
          Search
        </button>
      </form>
      <button type="button" class="btn btn-secondary mx-2" id="login" data-container="body" data-html="true" data-toggle="popover" data-placement="bottom" data-content="Bottom popover">
        Login
      </button>
    </nav>



    {% block body %}{% endblock body %}

    {% block tailjs %}{% endblock tailjs %}
</body>

</html>
